---
layout: default
---
<a class="back-link" href="{{ '/' | relative_url }}#posts">Back to all posts</a>

<article class="article">
  {% if page.tag %}
    <div class="meta"> <span class="tag-pill {{ page.tag_color | default: 'c1' }}">{{ page.tag }}</span> <span class="label">{{ page.date | date: "%B %-d, %Y" }}</span> </div>
  {% endif %}

  <h1>{{ page.title }}</h1>

  <div class="article-body">
    {{ content }}
  </div>
</article>
