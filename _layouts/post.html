---
layout: default
---
<div class="progress" aria-hidden="true"></div>
<script>
(function(){
  var bar = document.querySelector('.progress');
  function upd(){
    var h = document.documentElement;
    var p = h.scrollTop / ((h.scrollHeight - h.clientHeight) || 1);
    bar.style.transform = 'scaleX(' + Math.min(p, 1) + ')';
  }
  addEventListener('scroll', upd, { passive: true });
  upd();
})();
</script>
<div class="wrap">
  <a class="back-link" href="{{ '/' | relative_url }}#posts">Back to all posts</a>

  <article class="article">
    {% if page.tag %}
      <div class="meta"> <span class="tag-pill {{ page.tag_color | default: 'c1' }}">{{ page.tag }}</span> <span class="label">{{ page.date | date: "%B %-d, %Y" }}</span> </div>
    {% endif %}

    <h1>{{ page.title }}</h1>

    <div class="article-body">
      {{ content }}
    </div>
  </article>
</div>
